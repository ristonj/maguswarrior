# Mage Knight Digital — Card Definitions
#
# FORMAT REFERENCE
# ----------------
# Each card entry:
#
#   - id: march                    # Must match CardId used in deck composition and game state
#     type: BasicAction            # BasicAction | AdvancedAction | Spell | Artifact | Wound
#     name: "March"                # Display name shown in hand UI and logs
#     mana_cost: white             # Optional. Color required to play powered effect.
#     unpowered:              # Effect when played without paying mana cost (or no mana cost)
#       text: "..."                # Display text shown on card in UI
#       <effect fields>
#     powered:                # Effect when played with mana cost paid. Omit if card has no mana cost.
#       text: "..."
#       <effect fields>
#
# NOTE: Sideways play (Move 1 / Attack 1 / Block 1 / Influence 1) is a universal system
# rule applied at the point of play depending on the current phase. It is NOT stored
# per-card in this file.
#
# EFFECT FIELDS
# -------------
#   move: N                        — grant N movement points
#   attack: N                      — grant N attack (physical melee by default)
#   distance: ranged | siege       — attack distance (omit for melee)
#   element: fire | ice | cold_fire — attack element (omit for physical)
#   block: N                       — grant N block
#   influence: N                   — grant N influence
#   reputation: N                  — modify reputation track by N (negative = penalty)
#   fame_if_interaction: N         — grant N fame, only if card played during an interaction
#   reputation_if_interaction: N   — modify reputation by N, only if played during an interaction
#   mana_token:                    — gain mana tokens
#     colors: [blue, white, red]   — player picks one of the listed colors
#     count: N                     — number of tokens gained
#   extra_source_die: N            — may use N additional source dice this turn
#   gain_crystal: paid_color       — gain a crystal matching the mana just paid
#                  any_color       — gain a crystal; free choice of color
#                  green           — gain a green crystal specifically
#   discard_for:                   — discard another card from hand to get one of:
#     choices: [move, influence, attack, block]
#     amount: N
#   choose_one: [...]              — player picks exactly one effect from the list
#   heal: N                        — remove N wounds from hero or a unit
#   draw: N                        — draw N cards from deck
#   ready_unit:                    — un-wound a unit
#     max_level: N                 — unit must be level N or below
#   take_source_die:               — take a die from the Source
#     set_to_any_except: gold      — set it to any color except the named one
#     gain_tokens: N               — gain N mana tokens of the chosen color
#     no_reroll: true              — do not reroll this die when returning it to Source
#   play_with_card:                — play another Action card alongside this one
#     bonus: N                     — if that card gives Move/Influence/Attack/Block, add N
#     applies_to: [...]            — effect types the bonus applies to
#   (block element defaults to physical; use element: fire | ice | cold_fire for elemental blocks)
#   take_wound: true               — player takes a Wound as a cost
#   end_of_turn_reputation: N      — modify reputation at end of turn (negative = penalty)
#   end_of_turn_place: deck_bottom | deck_top  — where to return this card instead of discard
#   terrain_cost_reduction:        — reduce move cost of terrain types
#     terrains: [plains, desert, wasteland, forest, hill, swamp, lake, all]
#     amount: N
#     minimum: N
#   terrain_cost_override:         — set move cost of specific terrains to exact value
#     <terrain>: N
#   terrain_cost_override_all: N   — set move cost of ALL terrains to this value
#   unlock_terrain: [lake, ...]    — allow movement through normally impassable terrain
#   pay_mana_choose:               — pay mana, effect depends on color paid
#     <color>:
#       <effect fields>
#   unit_attack_bonus: N           — bonus added to the assigned unit's attack value
#   unit_block_bonus: N            — bonus added to the assigned unit's block value
#   unit_armor_bonus: N            — bonus added to the assigned unit's armor value
#   unit_grant_resistance: [fire, ice, physical]  — assigned unit gains resistance
#   all_units_attack_bonus: N      — bonus added to all friendly unit attack values
#   all_units_block_bonus: N       — bonus added to all friendly unit block values
#   all_units_armor_bonus: N       — bonus added to all friendly unit armor values
#   influence_per_wound: N         — gain N influence for each Wound in hand or on a unit
#   reduce_blocked_enemy_armor: N  — reduce armor of one blocked enemy by N (min 1)
#   reroll_all_source_dice: true   — reroll every die in the Source
#   gain_crystal_from_source_die: true  — pick a basic-color die, gain that crystal
#   first_attack_bonus: N          — bonus to the first attack card played this turn
#   first_block_bonus: N           — bonus to the first block card played this turn
#   condition: play_first          — effect only applies when you act before opponents
#
# ARTIFACT NOTES
# --------------
# Artifacts have no mana_cost. Both unpowered and powered effects are available when played
# from Inventory — unpowered is the standard effect, powered is the enhanced effect.
# To use the powered effect, the artifact is broken (thrown away) instead of discarded after use.
# No mana cost is required; destruction of the card is the cost.
# Banner-type artifacts use unpowered for the persistent assign-to-unit effect, and powered
# for the one-time break effect.
#
# SPELL NOTES
# -----------
# Spells use mana_cost to indicate the basic casting color. To cast unpowered, pay that
# color. To cast powered, pay that color PLUS black mana. Some spells offer an alternate
# effect by paying an additional mana of any color. mana_cost: any means any basic color.
#
# NOTES
# -----
# - Card counts per deck are defined in hero config, not here. This file is a catalog
#   of what each card type does.
# - Wound cards have no effect fields — they are defined in code only (WoundCard).
# - SOURCE DICE RULE: Mana dice taken from the Source (extra_source_die, take_source_die)
#   must be used immediately to power a card, unit, or skill. They do not generate tokens
#   and cannot be saved. Exception: cards that explicitly say "gain a mana token" from the
#   die (e.g. Mana Pull powered, Mana Draw powered) convert the die to a token on the spot.

cards:

  # ── Move Actions ─────────────────────────────────────────────────────────────

  - id: march
    type: BasicAction
    name: March
    mana_cost: green
    unpowered:
      effect_type: Move
      text: "Move 2"
      move: 2
    powered:
      effect_type: Move
      text: "Move 4"
      move: 4

  - id: stamina
    type: BasicAction
    name: Stamina
    mana_cost: blue
    unpowered:
      effect_type: Move
      text: "Move 2"
      move: 2
    powered:
      effect_type: Move
      text: "Move 4"
      move: 4

  # ── Influence Actions ─────────────────────────────────────────────────────────

  - id: threaten
    type: BasicAction
    name: Threaten
    mana_cost: red
    unpowered:
      effect_type: Influence
      text: "Influence 2"
      influence: 2
    powered:
      effect_type: Influence
      text: "Influence 5, Reputation -1"
      influence: 5
      reputation: -1

  - id: promise
    type: BasicAction
    name: Promise
    mana_cost: white
    unpowered:
      effect_type: Influence
      text: "Influence 2"
      influence: 2
    powered:
      effect_type: Influence
      text: "Influence 4"
      influence: 4

  # ── Combat Actions ────────────────────────────────────────────────────────────

  - id: rage
    type: BasicAction
    name: Rage
    mana_cost: red
    unpowered:
      effect_type: Combat
      choose_one:
        - attack: 2
        - block: 2
      text: "Attack or Block 2"
    powered:
      effect_type: Combat
      text: "Attack 4"
      attack: 4

  - id: determination
    type: BasicAction
    name: Determination
    mana_cost: blue
    unpowered:
      effect_type: Combat
      choose_one:
        - attack: 2
        - block: 2
      text: "Attack or Block 2"
    powered:
      effect_type: Combat
      text: "Block 5"
      block: 5

  # ── Mixed Actions ─────────────────────────────────────────────────────────────

  - id: swiftness
    type: BasicAction
    name: Swiftness
    mana_cost: white
    unpowered:
      effect_type: Move
      text: "Move 2"
      move: 2
    powered:
      effect_type: Combat
      text: "Ranged Attack 3"
      attack: 3
      distance: ranged

  - id: improvisation
    type: BasicAction
    name: Improvisation
    mana_cost: red
    unpowered:
      effect_type: [Move, Influence, Combat, Block]  # depends on current game phase (story 1b-7)
      text: "Discard another card from your hand to get Move 3, Influence 3, Attack 3, or Block 3."
      discard_for:
        choices: [move, influence, attack, block]
        amount: 3
    powered:
      effect_type: [Move, Influence, Combat, Block]  # depends on current game phase (story 1b-7)
      text: "Discard another card from your hand to get Move 5, Influence 5, Attack 5, or Block 5."
      discard_for:
        choices: [move, influence, attack, block]
        amount: 5

  # ── Special Actions ───────────────────────────────────────────────────────────

  - id: crystallize
    type: BasicAction
    name: Crystallize
    mana_cost: blue
    unpowered:
      effect_type: Special
      text: "When you play this card, also pay one mana of a basic color. Gain a crystal of that color."
      gain_crystal: paid_color
    powered:
      effect_type: Special
      text: "Gain a crystal of any color."
      gain_crystal: any_color

  - id: concentration
    type: BasicAction
    name: Concentration
    mana_cost: green
    unpowered:
      effect_type: Special
      text: "Gain a blue, white, or red mana token."
      mana_token:
        colors: [blue, white, red]
        count: 1
    powered:
      effect_type: Special
      text: "Play another Action card alongside this one. Get the stronger effect of that card for free. If that effect gives Move, Influence, Block, or any type of Attack, get that amount plus 2."
      play_with_card:
        bonus: 2
        applies_to: [move, influence, attack, block]

  - id: mana_draw
    type: BasicAction
    name: Mana Draw
    mana_cost: white
    unpowered:
      effect_type: Special
      text: "Use one additional mana die from the Source this turn."
      extra_source_die: 1
    powered:
      effect_type: Special
      text: "Take a mana die from the Source and set it to any color except gold. Gain two mana tokens of that color. Do not reroll this die when returning it to the Source."
      take_source_die:
        set_to_any_except: gold
        gain_tokens: 2
        no_reroll: true

  - id: tranquility
    type: BasicAction
    name: Tranquility
    mana_cost: green
    unpowered:
      effect_type: Healing
      text: "Heal 1 or draw a card."
      choose_one:
        - heal: 1
        - draw: 1
    powered:
      effect_type: Healing
      text: "Heal 2 or draw two cards."
      choose_one:
        - heal: 2
        - draw: 2

  # ── Nick (Norowas) Hero-Specific Starting Cards ───────────────────────────────

  - id: noble_manners
    type: BasicAction
    hero: nick
    name: Noble Manners
    mana_cost: white
    unpowered:
      effect_type: Influence
      text: "Influence 2. +1 Fame if used during an interaction."
      influence: 2
      fame_if_interaction: 1
    powered:
      effect_type: Influence
      text: "Influence 4. +1 Fame and +1 Reputation if used during an interaction."
      influence: 4
      fame_if_interaction: 1
      reputation_if_interaction: 1

  - id: rejuvenate
    type: BasicAction
    hero: nick
    name: Rejuvenate
    mana_cost: green
    unpowered:
      effect_type: Healing  # heal/draw/ready_unit=Healing; mana_token=Special
      text: "Choose one: Heal 1, draw a card, gain a green mana token, or ready a level I or II unit."
      choose_one:
        - heal: 1
        - draw: 1
        - mana_token:
            colors: [green]
            count: 1
        - ready_unit:
            max_level: 2
    powered:
      effect_type: Healing  # heal/draw/ready_unit=Healing; gain_crystal=Special
      text: "Choose one: Heal 2, draw two cards, gain a green crystal, or ready a level I, II, or III unit."
      choose_one:
        - heal: 2
        - draw: 2
        - gain_crystal: green
        - ready_unit:
            max_level: 3

  # ── Thomas (Torak) Hero-Specific Starting Cards ──────────────────────────────

  - id: instinct
    type: BasicAction
    hero: thomas
    name: Instinct
    mana_cost: red
    unpowered:
      effect_type: [Move, Influence, Combat]
      text: "Move 2, Influence 2, Attack 2, or Block 2."
      choose_one:
        - move: 2
        - influence: 2
        - attack: 2
        - block: 2
    powered:
      effect_type: [Move, Influence, Combat]
      text: "Move 4, Influence 4, Attack 4, or Block 4."
      choose_one:
        - move: 4
        - influence: 4
        - attack: 4
        - block: 4

  - id: cold_toughness
    type: BasicAction
    hero: thomas
    name: Cold Toughness
    mana_cost: blue
    unpowered:
      effect_type: Combat
      text: "Attack 2 or Ice Block 3."
      choose_one:
        - attack: 2
        - block: 3
          element: ice
    powered:
      effect_type: Combat
      text: "Ice Block 5. Get +1 Ice Block for each ability or color of attack depicted on the enemy token you block (unless it has arcane immunity), or for each mana spent by an opponent during an attack."
      block: 5
      element: ice
      ice_block_scaling:
        except: arcane_immunity
        # only abilities on the token itself count; site-based fortification does not
        per_ability:
          physical: 0
          fire: 1
          ice: 1
          cold_fire: 2
          swift: 1
          brutal: 1
          poison: 1
          paralyze: 1
          fortified: 1
          physical_resistance: 1
          fire_resistance: 1
          ice_resistance: 1

  # ── Aretha (Arythea) Hero-Specific Starting Cards ─────────────────────────────

  - id: battle_versatility
    type: BasicAction
    hero: aretha
    name: Battle Versatility
    mana_cost: red
    unpowered:
      effect_type: Combat
      text: "Attack 2, Block 2, or Ranged Attack 1."
      choose_one:
        - attack: 2
        - block: 2
        - attack: 1
          distance: ranged
    powered:
      effect_type: Combat
      text: "Attack 4, Block 4, Fire Attack 3, Fire Block 3, Ranged Attack 3, or Siege Attack 2."
      choose_one:
        - attack: 4
        - block: 4
        - attack: 3
          element: fire
        - block: 3
          element: fire
        - attack: 3
          distance: ranged
        - attack: 2
          distance: siege

  - id: mana_pull
    type: BasicAction
    hero: aretha
    name: Mana Pull
    mana_cost: white
    unpowered:
      effect_type: Special
      text: "You can use one additional mana die from the Source this turn. If that die is black, use it to produce mana of any color."
      extra_source_die: 1
      black_source_die_as_any_color: true
      # UX: when player takes this extra die, immediately prompt them to select
      # a card, unit, or skill to power with it — Source dice cannot be saved
    powered:
      effect_type: Special
      text: "Take two dice from the Source and set them to any color except gold. Gain a mana token of each of these colors. Do not reroll these dice when you return them to the Source."
      # Exception to the immediate-use rule: this card explicitly generates tokens
      # which may be used later this turn
      take_source_die:
        count: 2
        set_to_any_except: gold
        gain_tokens_per_die: 1
        no_reroll: true

  # ── George (Goldyx) Hero-Specific Starting Cards ──────────────────────────────

  - id: will_focus
    type: BasicAction
    hero: george
    name: Will Focus
    mana_cost: green
    unpowered:
      effect_type: Special
      text: "Gain a blue, white, or red mana token, or add a green crystal to your inventory."
      choose_one:
        - mana_token:
            colors: [blue, white, red]
            count: 1
        - gain_crystal: green
    powered:
      effect_type: Special
      text: "Play another Action card alongside this one. Get the stronger effect of that card for free. If that effect gives Move, Influence, Block, or any type of Attack, get that amount plus 3."
      play_with_card:
        bonus: 3
        applies_to: [move, influence, attack, block]

  - id: crystal_joy
    type: BasicAction
    hero: george
    name: Crystal Joy
    mana_cost: blue
    unpowered:
      effect_type: Special
      text: "When you play this card, also pay one mana of a basic color. Gain a crystal of that color. At the end of your turn, you may discard another non-wound card to take this card back to your hand."
      gain_crystal: paid_color
      end_of_turn_return:
        cost: discard_non_wound
        return_to: hand
    powered:
      effect_type: Special
      text: "Gain a crystal of any color. At the end of your turn, you may discard a card including a Wound to take this card back to your hand."
      gain_crystal: any_color
      end_of_turn_return:
        cost: discard_any
        return_to: hand

  # ── Advanced Actions ──────────────────────────────────────────────────────────

  - id: fire_bolt
    type: AdvancedAction
    name: Fire Bolt
    mana_cost: red
    unpowered:
      effect_type: Special
      text: "Gain a red crystal to your Inventory."
      gain_crystal: red
    powered:
      effect_type: Combat
      text: "Ranged Fire Attack 3."
      attack: 3
      distance: ranged
      element: fire

  - id: ice_bolt
    type: AdvancedAction
    name: Ice Bolt
    mana_cost: blue
    unpowered:
      effect_type: Special
      text: "Gain a blue crystal to your Inventory."
      gain_crystal: blue
    powered:
      effect_type: Combat
      text: "Ranged Ice Attack 3."
      attack: 3
      distance: ranged
      element: ice

  - id: swift_bolt
    type: AdvancedAction
    name: Swift Bolt
    mana_cost: white
    unpowered:
      effect_type: Special
      text: "Gain a white crystal to your Inventory."
      gain_crystal: white
    powered:
      effect_type: Combat
      text: "Ranged Attack 4."
      attack: 4
      distance: ranged

  - id: crushing_bolt
    type: AdvancedAction
    name: Crushing Bolt
    mana_cost: green
    unpowered:
      effect_type: Special
      text: "Gain a green crystal to your Inventory."
      gain_crystal: green
    powered:
      effect_type: Combat
      text: "Siege Attack 3."
      attack: 3
      distance: siege

  - id: blood_rage
    type: AdvancedAction
    name: Blood Rage
    mana_cost: red
    unpowered:
      effect_type: Combat
      text: "Attack 2. You may take a Wound to increase this to Attack 5."
      attack: 2
      optional_wound_bonus:
        take_wound: true
        attack: 5
    powered:
      effect_type: Combat
      text: "Attack 4. You may take a Wound to increase this to Attack 9."
      attack: 4
      optional_wound_bonus:
        take_wound: true
        attack: 9

  - id: ice_shield
    type: AdvancedAction
    name: Ice Shield
    mana_cost: blue
    unpowered:
      effect_type: Combat
      text: "Ice Block 3."
      block: 3
      element: ice
    powered:
      effect_type: Combat
      text: "Ice Block 3. Reduce the Armor of one enemy blocked this way by 3 (minimum 1)."
      block: 3
      element: ice
      reduce_blocked_enemy_armor: 3

  - id: agility
    type: AdvancedAction
    name: Agility
    mana_cost: white
    unpowered:
      effect_type: Move
      text: "Move 2. During combat this turn, you may spend remaining Move points as Attack 1 each."
      move: 2
      special: move_as_attack
    powered:
      effect_type: Move
      text: "Move 4. During combat this turn, you may spend remaining Move points as Attack 1 each, or 2 Move points for Ranged Attack 1."
      move: 4
      special: move_as_attack_or_ranged

  - id: refreshing_walk
    type: AdvancedAction
    name: Refreshing Walk
    mana_cost: green
    unpowered:
      effect_type: Move
      text: "Move 2 and Heal 1."
      move: 2
      heal: 1
    powered:
      effect_type: Move
      text: "Move 4 and Heal 2."
      move: 4
      heal: 2

  - id: intimidate
    type: AdvancedAction
    name: Intimidate
    mana_cost: red
    unpowered:
      effect_type: [Influence, Combat]  # depends on player's choice
      text: "Influence 4 or Attack 3. Reputation -1 at the end of your turn."
      choose_one:
        - effect_type: Influence
          influence: 4
        - effect_type: Combat
          attack: 3
      end_of_turn_reputation: -1
    powered:
      effect_type: [Influence, Combat]
      text: "Influence 8 or Attack 7. Reputation -2 at the end of your turn."
      choose_one:
        - effect_type: Influence
          influence: 8
        - effect_type: Combat
          attack: 7
      end_of_turn_reputation: -2

  - id: frost_bridge
    type: AdvancedAction
    name: Frost Bridge
    mana_cost: blue
    unpowered:
      effect_type: Move
      text: "Move 2. The Move cost of swamps is reduced to 1 this turn."
      move: 2
      terrain_cost_override:
        swamp: 1
    powered:
      effect_type: Move
      text: "Move 4. You may travel through lakes this turn. The Move cost of lakes and swamps is reduced to 1."
      move: 4
      terrain_cost_override:
        swamp: 1
        lake: 1
      unlock_terrain: [lake]

  - id: song_of_wind
    type: AdvancedAction
    name: Song of Wind
    mana_cost: white
    unpowered:
      effect_type: Move
      text: "Move 2. The Move cost of plains, deserts and wastelands is reduced by 1 (minimum 0) this turn."
      move: 2
      terrain_cost_reduction:
        terrains: [plains, desert, wasteland]
        amount: 1
        minimum: 0
    powered:
      effect_type: Move
      text: "Move 2. The Move cost of plains, deserts and wastelands is reduced by 2 (minimum 0). You may pay blue mana to travel through lakes at Move cost 1."
      move: 2
      terrain_cost_reduction:
        terrains: [plains, desert, wasteland]
        amount: 2
        minimum: 0
      special: optional_blue_mana_lake_access

  - id: path_finding
    type: AdvancedAction
    name: Path Finding
    mana_cost: green
    unpowered:
      effect_type: Move
      text: "Move 2. The Move cost of all terrains is reduced by 1 (minimum 2) this turn."
      move: 2
      terrain_cost_reduction:
        terrains: [all]
        amount: 1
        minimum: 2
    powered:
      effect_type: Move
      text: "Move 4. The Move cost of all terrains is reduced to 2 this turn."
      move: 4
      terrain_cost_override_all: 2

  - id: blood_ritual
    type: AdvancedAction
    name: Blood Ritual
    mana_cost: red
    unpowered:
      effect_type: Special
      text: "Take a Wound. Gain a red mana token and a mana token of any color (including non-basic)."
      take_wound: true
      mana_token:
        colors: [red]
        count: 1
      special: gain_any_mana_token_including_black
    powered:
      effect_type: Special
      text: "Take a Wound. Gain three mana tokens of any colors (including non-basic)."
      take_wound: true
      special: gain_three_any_mana_tokens_including_black

  - id: pure_magic
    type: AdvancedAction
    name: Pure Magic
    mana_cost: blue
    unpowered:
      effect_type: [Move, Influence, Combat]  # depends on mana color paid
      text: "Pay a mana. If green, Move 4. If white, Influence 4. If blue, Block 4. If red, Attack 4."
      pay_mana_choose:
        green:
          effect_type: Move
          move: 4
        white:
          effect_type: Influence
          influence: 4
        blue:
          effect_type: Combat
          block: 4
        red:
          effect_type: Combat
          attack: 4
    powered:
      effect_type: [Move, Influence, Combat]
      text: "Pay a mana. If green, Move 7. If white, Influence 7. If blue, Block 7. If red, Attack 7."
      pay_mana_choose:
        green:
          effect_type: Move
          move: 7
        white:
          effect_type: Influence
          influence: 7
        blue:
          effect_type: Combat
          block: 7
        red:
          effect_type: Combat
          attack: 7

  - id: heroic_tale
    type: AdvancedAction
    name: Heroic Tale
    mana_cost: white
    unpowered:
      effect_type: Influence
      text: "Influence 3. For each Unit you recruited this turn, Reputation +1 at the end of your turn."
      influence: 3
      special: reputation_plus_one_per_recruited_unit
    powered:
      effect_type: Influence
      text: "Influence 6. For each Unit you recruited this turn, Fame +1 and Reputation +1 at the end of your turn."
      influence: 6
      special: fame_and_reputation_plus_one_per_recruited_unit

  - id: regeneration
    type: AdvancedAction
    name: Regeneration
    mana_cost: green
    unpowered:
      effect_type: Healing
      text: "Heal 1. Ready a Level I or II Unit you control."
      heal: 1
      ready_unit:
        max_level: 2
    powered:
      effect_type: Healing
      text: "Heal 2. Ready a Level I, II or III Unit you control."
