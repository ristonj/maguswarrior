# Mage Knight Digital — Unit Definitions
#
# FORMAT REFERENCE
# ----------------
# Each unit entry:
#
#   - id: peasants                 # Must match UnitId used in game state
#     name: "Peasants"             # Display name
#     tier: silver | gold          # Determines which Unit offer deck the card belongs to
#     level: 1 | 2 | 3 | 4         # Unit level (I–IV); affects Command limit and ready costs
#     cost: N                      # Influence required to recruit this unit
#     armor: N                     # Base armor value (damage dealt to unit in excess of this wounds it)
#     count: N                     # Number of copies in the Unit deck
#     abilities:                   # List of abilities the unit provides; each has a text field
#                                  # and optional structured effect fields (same as cards.yaml)
#
# ABILITY EFFECT FIELDS (same as cards.yaml plus unit-specific):
#   attack: N                      — attack value (physical melee by default)
#   distance: ranged | siege       — attack distance modifier (omit for melee)
#   element: fire | ice | cold_fire — attack or block element (omit for physical)
#   block: N                       — block value (physical by default; combine with element for elemental)
#   heal: N                        — heal hero or a unit
#   influence: N                   — generate influence
#   move: N                        — generate move
#   mana_token: {colors, count}    — gain mana tokens
#   gain_crystal: <color>          — gain a crystal
#   ready_unit: {max_level}        — un-wound a unit
#   choose_one: [...]              — player picks exactly one effect
#
# UNIT-SPECIFIC EFFECT FIELDS:
#   loses_swiftness_when_blocked: true   — enemy blocked this way loses the Swiftness ability
#   this_unit_becomes_wounded: true      — this unit becomes Wounded after using this ability
#   terrain_cost_reduction:              — reduce move cost of terrain types (see cards.yaml)
#   target_enemy_does_not_attack: true   — target enemy skips its attack this combat
#   target_enemy_armor_reduction: N      — reduce target enemy armor by N (minimum 1)
#   all_units_gain_resistance: [...]     — all friendly units gain listed resistances this turn
#
# NOTES
# -----
# - Silver units (levels I–II) are in the Silver Unit deck; Gold units (levels III–IV) in Gold Unit deck.
# - Unit count refers to copies in the full Unit deck across all players.

units:

  # ── Silver Units ──────────────────────────────────────────────────────────────

  - id: peasants
    name: Peasants
    tier: silver
    level: 1
    cost: 4
    armor: 3
    count: 3
    recruit_sites:
      - village
    abilities:
      - effect_type: Combat
        text: "Attack or Block 2."
        choose_one:
          - attack: 2
          - block: 2
      - effect_type: Influence
        text: "Influence 2."
        influence: 2
      - effect_type: Move
        text: "Move 2."
        move: 2

  - id: herbalists
    name: Herbalists
    tier: silver
    level: 1
    cost: 3
    armor: 2
    count: 2
    recruit_sites:
      - village
      - monastery
    abilities:
      - effect_type: Healing
        text: "Heal 2."
        mana_cost: green
        heal: 2
      - effect_type: Healing
        text: "Ready a level I or II Unit."
        ready_unit:
          max_level: 2
      - effect_type: Special
        text: "Gain a green mana token."
        mana_token:
          colors: [green]
          count: 1

  - id: foresters
    name: Foresters
    tier: silver
    level: 1
    cost: 5
    armor: 4
    count: 2
    recruit_sites:
      - village
    abilities:
      - effect_type: Move
        text: "Move 2. The move cost of forests, hills and swamps is reduced by 1 (minimum 0) this turn."
        move: 2
        terrain_cost_reduction:
          terrains: [forest, hill, swamp]
          amount: 1
          minimum: 0
      - effect_type: Combat
        text: "Block 3."
        block: 3

  - id: utem_crossbowmen
    name: Utem Crossbowmen
    tier: silver
    level: 2
    cost: 6
    armor: 4
    count: 2
    recruit_sites:
      - village
      - keep
    abilities:
      - effect_type: Combat
        text: "Attack or Block 3."
        choose_one:
          - attack: 3
          - block: 3
      - effect_type: Combat
        text: "Ranged Attack 2."
        attack: 2
        distance: ranged

  - id: utem_guardsmen
    name: Utem Guardsmen
    tier: silver
    level: 2
    cost: 5
    armor: 5
    count: 2
    recruit_sites:
      - village
      - keep
