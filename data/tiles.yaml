# Mage Knight Digital — Tile Definitions
#
# FORMAT REFERENCE
# ----------------
# Each tile entry:
#
#   - id: "tile_country_01"        # Must match TileId used in GameStateFactory / scenario setup
#     type: Countryside            # Countryside | Core | CityWhite | CityBlue | CityGreen | CityRed
#     name: "Countryside Tile 1"  # Human-readable label (used in logs/debug only)
#     hexes:
#       - position: C              # Named position on tile (see HEX POSITIONS below)
#         terrain: Plains          # Plains | Forest | Hills | Desert | Water | Swamp | Wasteland | Mountain
#         site: Village            # Optional. Omit if no site on this hex.
#         portal: true             # Optional. Only on the starting tile portal hex.
#         rampaging: OrcMarauder   # Optional. OrcMarauder | Draconum. Rampaging enemy pre-placed here.
#
# HEX POSITIONS
# -------------
# Each tile has 7 hexes: one center and six neighbors.
# Use these named positions — no axial coordinates needed.
#
#         NW   NE
#        W   C   E
#         SW   SE
#
#   C  — Center
#   NE — North-East
#   E  — East
#   SE — South-East
#   SW — South-West
#   W  — West
#   NW — North-West
#
# TERRAIN VALUES
# --------------
#   Plains     — open land, Move cost 2 day/night
#   Forest     — dense woods, Move cost 3 day / 5 night
#   Hills      — rolling hills, Move cost 3 day/night
#   Desert     — arid waste, Move cost 3 day / 2 night (easier at night, harder by day)
#   Water      — impassable (lake, sea edge)
#   Swamp      — difficult terrain, Move cost 3 day/night
#   Wasteland  — ruined land, Move cost 2 day/night
#   Mountain   — impassable
#   City       — city center hex, Move cost 2 day/night
#
# SITE VALUES
# -----------
#   Village           — recruit units + healing (2 Healing points for 3 Influence)
#   Monastery         — buy Advanced Actions (6 Influence), healing (2 Influence)
#   MageTower         — buy Spells (7 Influence + 1 mana of same color)
#   Keep              — conquer to recruit + Hand limit +1 per keep owned
#   MagicalGlade      — throw away 1 Wound at end of turn; gain gold mana token at start of turn
#   CrystalMine       — gain 1 crystal of matching color at end of turn
#   MonsterDen        — adventure site, 2 random brown enemies
#   Dungeon           — adventure site, 1 random brown enemy (night rules apply and no units)
#   Tomb              — adventure site, 1 random brown enemy + reward
#   Ruins             — adventure site (Ancient Altar or Enemies with Treasure)
#   SpawningGrounds   — adventure site, 1 random brown enemy
#   RampagingOrc      — 1 random green enemy 
#   RampagingDraconum — 1 random red enemy

tiles:

  # ============================================================
